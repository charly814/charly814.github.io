<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pedir · Restaurante Platet</title>
  <style>
    :root { --bg: #f5f6fa; --ink: #2f3640; --muted: #7f8fa6; --accent: #40739e; --price: #e84118; --ok: #27ae60; --line: #e4e6eb; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--ink); padding-bottom: 96px; }
    button { font: inherit; cursor: pointer; }
    header.top { background: #fff; padding: 16px; text-align: center; border-bottom: 1px solid var(--line); }
    header.top h1 { margin: 0; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; }
    header.top p { margin: 4px 0 0; color: var(--muted); }
    .table-pill { display: inline-block; margin-top: 8px; background: var(--accent); color: #fff; border-radius: 999px; padding: 4px 14px; font-weight: 600; }
    .chips { position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: var(--bg); border-bottom: 1px solid var(--line); scrollbar-width: none; }
    .chips a { flex: 0 0 auto; text-decoration: none; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font-size: 14px; white-space: nowrap; }
    main { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .quick button { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
    section.cat { background: #fff; border-radius: 12px; padding: 4px 16px; margin: 16px 0; box-shadow: 0 1px 4px rgba(0,0,0,.06); scroll-margin-top: 64px; }
    section.cat h2 { color: var(--accent); font-size: 18px; border-left: 4px solid var(--accent); padding-left: 10px; }
    .item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px dotted var(--line); }
    .item .name { flex: 1; }
    .item .price { color: var(--price); font-weight: 600; white-space: nowrap; }
    .stepper { display: flex; align-items: center; gap: 6px; }
    .stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--accent); background: #fff; color: var(--accent); font-size: 20px; line-height: 1; }
    .stepper button.add { background: var(--accent); color: #fff; }
    .stepper b { min-width: 18px; text-align: center; }
    .cartbar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: transparent; z-index: 10; }
    .cartbar button { width: 100%; max-width: 720px; display: flex; justify-content: space-between; margin: 0 auto; background: var(--ok); color: #fff; border: 0; border-radius: 14px; padding: 16px 18px; font-size: 17px; font-weight: 600; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
    .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
    .sheet { background: #fff; width: 100%; max-width: 720px; max-height: 88vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
    .sheet h2 { margin: 0 0 8px; }
    .sheet textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; }
    .total { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; margin: 14px 0; }
    .btn { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; background: var(--ok); color: #fff; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); margin-top: 8px; }
    .btn:disabled { opacity: .6; }
    .status { background: #fff; border-radius: 12px; padding: 12px 16px; margin: 16px 0; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .status h3 { margin: 4px 0 8px; font-size: 16px; }
    .st { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
    .st .s-new { color: #e1a100; } .st .s-accepted, .st .s-done { color: var(--ok); } .st .s-rejected { color: var(--price); }
    .empty { text-align: center; padding: 48px 16px; color: var(--muted); }
    .warning { background: #fff3cd; border-left: 4px solid #ffeeba; padding: 12px 15px; margin: 24px 0; border-radius: 4px; font-size: 14px; }
    .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; z-index: 30; }
    .hidden { display: none !important; }
    .status.closed { border-left: 4px solid var(--price); }
    .status.closed h3 { color: var(--price); }
    .status.kclosed { border-left: 4px solid #e1a100; background: #fffbeb; }
    section.cat.off .item { opacity: .5; }
    .item .pic { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; flex: 0 0 64px; background: #f1f5f9; }
    .item .name small.desc { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .item .name small.alg { font-size: 15px; letter-spacing: 2px; margin-top: 2px; }
    section.cat h2 .kc { font-size: 13px; color: #b45309; font-weight: 600; }
    .lang { position: absolute; top: 10px; right: 10px; display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .lang button { border: 0; background: #fff; padding: 6px 9px; font-size: 13px; }
    .lang button.on { background: var(--accent); color: #fff; }
    header.top { position: relative; }
    .item .name { cursor: pointer; }
    .item .name small { display: block; color: var(--muted); font-size: 12px; }
    .item .name u { text-decoration: none; color: var(--accent); font-size: 12px; white-space: nowrap; }
    .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 0 0; }
    .cart-line .name em { display: block; font-style: normal; font-size: 12px; color: #b45309; }
    .mod-h { margin: 14px 0 6px; font-size: 13px; letter-spacing: 1px; color: var(--muted); }
    .mod-h.sin { color: var(--price); } .mod-h.extra { color: var(--ok); }
    .chips-sel { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips-sel button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 12px; font-size: 14px; }
    .chips-sel button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .sheet input[type=text] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; }
    .qty-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 16px 0; }
    .qty-row b { font-size: 20px; }
  </style>
</head>
<body>
  <header class="top">
    <span class="lang" id="lang"></span>
    <h1>🍴 Restaurante Platet</h1>
    <p>C/ José García Ferrández, 2 · Elx</p>
    <span class="table-pill" id="table-pill"></span>
  </header>
  <nav class="chips" id="chips"></nav>
  <main id="main"></main>
  <div class="cartbar hidden" id="cartbar"><button id="cart-btn"></button></div>
  <div class="sheet-bg hidden" id="sheet-bg"><div class="sheet" id="sheet"></div></div>
  <div class="toast hidden" id="toast"></div>

  <script src="config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/common.js"></script>
  <script src="js/i18n.js"></script>
  <script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo offline */ });
  </script>
  <script>
  (function () {
    'use strict';
    var P = window.Platet, fmt = P.fmt, esc = P.esc;
    var I = I18N.init('platet-lang');
    var t = function (k, v) { return I.t(k, v); };
    var params = new URLSearchParams(location.search);
    var table = String(params.get('mesa') || '').toUpperCase();
    // Vale cualquier mesa del plano o temporal; el TPV avisa si no existe.
    var validTable = P.TABLE_ID_RE.test(table);
    var qrCfg = P.DEFAULT_QR;

    var menu = P.DEFAULT_MENU;
    var mods = P.DEFAULT_MODS;
    // Carrito: líneas {key, pid, qty, mods: [ids], note}. Las líneas sin
    // personalizar usan key = pid; las personalizadas, una key propia.
    var cart = [];
    var note = '';
    var MY_KEY = 'platet-my-orders:' + table;
    var mine = [];          // [{id, type, createdAt, status, reason}]
    try { mine = JSON.parse(sessionStorage.getItem(MY_KEY)) || []; } catch (e) { mine = []; }
    var subs = {};
    var sheetMode = null;   // 'cart' | {custom state}

    var main = document.getElementById('main');
    var chips = document.getElementById('chips');
    var cartbar = document.getElementById('cartbar');
    var sheetBg = document.getElementById('sheet-bg');
    var sheet = document.getElementById('sheet');

    function drawLang() {
      document.getElementById('lang').innerHTML = Object.keys(I.LANGS).map(function (l) {
        return '<button class="' + (I.lang === l ? 'on' : '') + '" data-a="lang" data-l="' + l + '">' + I.LANGS[l] + '</button>';
      }).join('');
    }
    drawLang();

    if (!validTable) {
      document.getElementById('table-pill').classList.add('hidden');
      main.innerHTML = '<div class="empty"><p style="font-size:40px">📷</p><p>' + t('c.scan') + '</p><p><a href="index.html">' + t('c.seeMenu') + '</a></p></div>';
      document.addEventListener('click', function (e) {
        var b = e.target.closest('[data-a="lang"]');
        if (b) { I.set(b.dataset.l); location.reload(); }
      });
      return;
    }

    Store.on('menu', function (v) { menu = v || P.DEFAULT_MENU; render(); });
    Store.on('public/qr', function (v) { qrCfg = Object.assign({}, P.DEFAULT_QR, v || {}); render(); });
    // el horario cambia con la hora: se comprueba cada minuto
    var lastKey = '';
    setInterval(function () {
      var st = P.qrStatus(qrCfg);
      var k = st.open + '|' + st.kitchen;
      if (k !== lastKey) render();
    }, 60000);
    Store.on('mods', function (v) {
      // En modo nube los modificadores son privados del TPV; si no se pueden leer, se usan los de serie.
      mods = v || P.DEFAULT_MODS; render();
    });
    mine.forEach(watch);

    function visibleCats() {
      return menu.map(function (c) {
        return Object.assign({}, c, { items: (c.items || []).filter(function (i) { return i.available !== false; }) });
      }).filter(function (c) { return c.items.length; });
    }

    // ¿Se puede pedir este producto ahora? (horario QR y horario de cocina)
    function canOrder(pid, st) {
      st = st || P.qrStatus(qrCfg);
      return st.open && (st.kitchen || st.kitchenCats.indexOf(P.catOfItem(menu, pid)) < 0);
    }
    function isKitchen(catId, st) { return st.kitchenCats.indexOf(catId) >= 0; }

    function scheduleHtml(st) {
      if (!st.open) {
        return '<div class="status closed"><h3>' + t(st.reason === 'paused' ? 'c.paused' : 'c.closed') + '</h3><p>' +
          (st.next ? t('c.opensAt', { h: st.next }) + ' ' : '') + t('c.closedHelp') + '</p></div>';
      }
      if (!st.kitchen) return '<div class="status kclosed"><p>' + t('c.kitchenNote') + '</p></div>';
      return '';
    }

    function plainQty(pid) {
      var l = cart.filter(function (x) { return x.key === pid; })[0];
      return l ? l.qty : 0;
    }

    var raf = 0;
    function later() { if (!raf) raf = requestAnimationFrame(function () { raf = 0; render(); if (sheetMode === 'cart') openCart(); }); }

    function render() {
      document.getElementById('table-pill').textContent = t('table', { t: table });
      var st = P.qrStatus(qrCfg);
      lastKey = st.open + '|' + st.kitchen;
      // quitar del carrito lo que ya no se puede pedir (p. ej. la cocina acaba de cerrar)
      var before = cart.length;
      cart = cart.filter(function (l) { return canOrder(l.pid, st); });
      if (cart.length < before) toast(t('c.removed'));
      var cats = visibleCats();
      chips.innerHTML = cats.map(function (c) {
        return '<a href="#c-' + esc(c.id) + '">' + esc(c.icon || '') + ' ' + esc(P.tr(c, I.lang)) + '</a>';
      }).join('');
      main.innerHTML = scheduleHtml(st) + statusHtml() +
        '<div class="quick"><button data-a="waiter">' + t('c.waiter') + '</button><button data-a="bill">' + t('c.bill') + '</button></div>' +
        (st.open ? '<p class="hint">' + t('c.customizeHint') + '</p>' : '') +
        cats.map(function (c) {
          var off = !st.open || (!st.kitchen && isKitchen(c.id, st));
          var kOff = st.open && !st.kitchen && isKitchen(c.id, st);
          return '<section class="cat' + (off ? ' off' : '') + '" id="c-' + esc(c.id) + '"><h2>' + esc(c.icon || '') + ' ' + esc(P.tr(c, I.lang)) +
            (kOff ? ' <small class="kc">' + (st.kitchenNext ? t('c.kitchenOpensAt', { h: st.kitchenNext }) : t('c.kitchenClosed')) + '</small>' : '') + '</h2>' +
            c.items.map(function (it) {
              var q = plainQty(it.id);
              var es = I.lang !== 'es' && P.tr(it, I.lang) !== it.name ? '<small>' + esc(it.name) + '</small>' : '';
              var desc = P.trDesc(it, I.lang);
              var al = (it.allergens || []).map(function (a) {
                var x = P.ALLERGENS.filter(function (y) { return y.id === a; })[0];
                return x ? '<span title="' + esc(P.tr(x, I.lang)) + '">' + x.icon + '</span>' : '';
              }).join('');
              var pu = it.img ? Store.imageURL('p-' + it.id, it.img, later) : '';
              return '<div class="item">' + (pu ? '<img class="pic" src="' + pu + '" alt="" loading="lazy">' : '') +
                '<span class="name"' + (off ? '' : ' data-a="custom" data-id="' + esc(it.id) + '"') + '>' + esc(P.tr(it, I.lang)) + (off ? '' : ' <u>✏️</u>') + es +
                (desc ? '<small class="desc">' + esc(desc) + '</small>' : '') +
                (al ? '<small class="alg" aria-label="' + esc(t('c.allergens2')) + '">' + al + '</small>' : '') + '</span>' +
                '<span class="price">' + fmt(it.price) + '</span>' +
                (off ? '' : '<span class="stepper">' + (q ? '<button data-a="minus" data-key="' + esc(it.id) + '" aria-label="−">−</button><b>' + q + '</b>' : '') +
                '<button class="add" data-a="plus" data-id="' + esc(it.id) + '" aria-label="+">+</button></span>') + '</div>';
            }).join('') + '</section>';
        }).join('') +
        '<p class="hint">' + t('c.other') + '</p>' +
        '<div class="warning"><b>' + t('c.allergensT') + '</b><br>' + t('c.allergens') + '</div>';
      renderCartBar();
    }

    function statusHtml() {
      if (!mine.length) return '';
      return '<div class="status"><h3>' + t('c.mine') + '</h3>' + mine.slice().reverse().map(function (o) {
        return '<div class="st"><span>' + t('c.t.' + o.type) + ' · ' + new Date(o.createdAt).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }) + '</span>' +
          '<span class="s-' + esc(o.status) + '">' + t('c.s.' + o.status) + (o.reason ? ' — ' + esc(o.reason) : '') + '</span></div>';
      }).join('') + '</div>';
    }

    function modObjs(ids) { return (ids || []).map(function (id) { return P.findMod(mods, id); }).filter(Boolean); }
    function unitPrice(l) {
      var it = P.findItem(menu, l.pid);
      if (!it) return 0;
      return it.price + modObjs(l.mods).reduce(function (s, m) { return s + (m.type === 'extra' ? (m.price || 0) : 0); }, 0) +
        P.comboChoices(menu, it, l.combo || []).reduce(function (s, c) { return s + c.extra; }, 0);
    }
    function isCombo(it) { return !!(it && it.combo && (it.combo.courses || []).length); }
    function validLines() { return cart.filter(function (l) { return P.findItem(menu, l.pid) && l.qty > 0; }); }
    function cartTotal() { return validLines().reduce(function (s, l) { return s + unitPrice(l) * l.qty; }, 0); }
    function cartCount() { return validLines().reduce(function (s, l) { return s + l.qty; }, 0); }

    function renderCartBar() {
      var n = cartCount();
      cartbar.classList.toggle('hidden', !n);
      document.getElementById('cart-btn').innerHTML = '<span>' + t('c.view', { n: n }) + '</span><span>' + fmt(cartTotal()) + '</span>';
    }

    function openCart() {
      sheetMode = 'cart';
      var lines = validLines();
      if (!lines.length) return closeSheet();
      sheet.innerHTML = '<h2>' + t('c.yourOrder', { t: esc(t('table', { t: table })) }) + '</h2>' +
        lines.map(function (l) {
          var it = P.findItem(menu, l.pid);
          var sub = [l.combo ? P.comboChoices(menu, it, l.combo).map(function (c) { var x = c.pid && P.findItem(menu, c.pid); return x ? P.tr(x, I.lang) : c.choice; }).join(' · ') : '',
            P.modsText(modObjs(l.mods), I.lang), l.note].filter(Boolean).join(' · ');
          return '<div class="item cart-line"><span class="name">' + esc(P.tr(it, I.lang)) + (sub ? '<em>' + esc(sub) + '</em>' : '') + '</span>' +
            '<span class="price">' + fmt(unitPrice(l) * l.qty) + '</span>' +
            '<span class="stepper"><button data-a="minus" data-key="' + esc(l.key) + '">−</button><b>' + l.qty + '</b><button class="add" data-a="inc" data-key="' + esc(l.key) + '">+</button></span></div>';
        }).join('') +
        '<p><label for="note">' + t('c.note') + '</label></p>' +
        '<textarea id="note" maxlength="120">' + esc(note) + '</textarea>' +
        '<div class="total"><span>' + t('total') + '</span><span>' + fmt(cartTotal()) + '</span></div>' +
        '<button class="btn" data-a="send">' + t('c.send') + '</button>' +
        '<button class="btn ghost" data-a="close">' + t('c.keep') + '</button>';
      document.getElementById('note').oninput = function (e) { note = e.target.value; };
      sheetBg.classList.remove('hidden');
    }

    function chipsFor(type, st) {
      return '<div class="chips-sel">' + mods.filter(function (m) { return m.type === type; }).map(function (m) {
        return '<button class="' + (st.sel[m.id] ? 'on' : '') + '" data-a="mod" data-id="' + esc(m.id) + '">' + esc(P.tr(m, I.lang)) + (m.price ? ' +' + fmt(m.price) : '') + '</button>';
      }).join('') + '</div>';
    }

    function openCustom(pid) {
      var it = P.findItem(menu, pid);
      if (!it) return;
      sheetMode = sheetMode && sheetMode.pid === pid ? sheetMode : { pid: pid, sel: {}, note: '', qty: 1, picks: ((it.combo && it.combo.courses) || []).map(function () { return []; }) };
      var st = sheetMode;
      var ids = Object.keys(st.sel).filter(function (k) { return st.sel[k]; });
      var price = unitPrice({ pid: pid, mods: ids, combo: st.picks }) * st.qty;
      // menú del día: primero elegir los platos
      var courses = isCombo(it) ? it.combo.courses.map(function (c, ci) {
        return '<h4 class="mod-h">' + esc(P.tr(c, I.lang)) + ((Number(c.pick) || 1) > 1 ? ' (' + c.pick + ')' : '') + '</h4><div class="chips-sel">' +
          c.options.map(function (o, oi) {
            return '<button class="' + (st.picks[ci].indexOf(oi) >= 0 ? 'on' : '') + '" data-a="pick" data-c="' + ci + '" data-o="' + oi + '">' +
              esc(P.comboOptName(menu, o, I.lang)) + (o.extra ? ' +' + fmt(o.extra) : '') + '</button>';
          }).join('') + '</div>';
      }).join('') : '';
      var ready = !isCombo(it) || P.comboComplete(it, st.picks);
      sheet.innerHTML = '<h2>' + esc(P.tr(it, I.lang)) + '</h2>' + courses +
        (isCombo(it) ? '' : '<h4 class="mod-h sin">' + t('mod.sin') + '</h4>' + chipsFor('sin', st)) +
        (isCombo(it) ? '' : '<h4 class="mod-h extra">' + t('mod.extra') + '</h4>' + chipsFor('extra', st) +
        '<h4 class="mod-h">' + t('mod.prep') + '</h4>' + chipsFor('prep', st)) +
        '<h4 class="mod-h">' + t('c.itemNote') + '</h4><input type="text" id="item-note" maxlength="80" value="' + esc(st.note) + '">' +
        '<div class="qty-row"><span class="stepper"><button data-a="cqty" data-d="-1">−</button><b>' + st.qty + '</b><button class="add" data-a="cqty" data-d="1">+</button></span></div>' +
        '<button class="btn" data-a="cadd"' + (ready ? '' : ' disabled') + '>' + (ready ? t('c.addToOrder', { n: fmt(price) }) : t('c.pickDishes')) + '</button>' +
        '<button class="btn ghost" data-a="close">' + t('cancel') + '</button>';
      document.getElementById('item-note').oninput = function (e) { st.note = e.target.value; };
      sheetBg.classList.remove('hidden');
    }

    function closeSheet() { sheetMode = null; sheetBg.classList.add('hidden'); }
    function refreshSheet() {
      if (sheetMode === 'cart') openCart();
      else if (sheetMode) openCustom(sheetMode.pid);
    }

    function send(type, lines) {
      var last = mine.filter(function (o) { return o.type === type; }).slice(-1)[0];
      if (type !== 'order' && last && last.status === 'new' && Date.now() - last.createdAt < 60000) {
        toast(t('c.already'));
        return Promise.resolve(false);
      }
      var id = Store.newId();
      var order = {
        id: id, type: type, table: table, status: 'new', createdAt: Date.now(),
        lines: lines || [], note: type === 'order' ? note.trim().slice(0, 120) : '', lang: I.lang
      };
      // Espera a que el servidor lo confirme: el cliente solo ve «enviado» si de verdad ha llegado.
      return Store.set('orders/' + id, order, { wait: 12000 }).then(function () {
        mine.push({ id: id, type: type, createdAt: order.createdAt, status: 'new' });
        saveMine();
        watch(mine[mine.length - 1]);
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return true;
      }).catch(function () {
        toast(t('c.fail'));
        return false;
      });
    }

    function watch(o) {
      if (subs[o.id] || o.status !== 'new') return;
      subs[o.id] = Store.on('orders/' + o.id, function (v) {
        if (!v) return;
        o.status = v.status; o.reason = v.reason || '';
        if (v.status !== 'new') {
          if (v.status === 'accepted') toast(t('c.confirmed'));
          if (v.status === 'rejected') toast(t('c.rejected'));
          if (subs[o.id]) { subs[o.id](); delete subs[o.id]; }
        }
        saveMine();
        render();
      });
    }

    function saveMine() {
      try { sessionStorage.setItem(MY_KEY, JSON.stringify(mine.slice(-20))); } catch (e) { /* ignorar */ }
    }

    function lineByKey(key) { return cart.filter(function (l) { return l.key === key; })[0]; }

    document.addEventListener('click', function (e) {
      if (e.target === sheetBg) return closeSheet();
      if (e.target.closest('#cart-btn')) return openCart();
      var b = e.target.closest('[data-a]');
      if (!b) return;
      var a = b.dataset.a, l;
      switch (a) {
        case 'lang': I.set(b.dataset.l); drawLang(); render(); return refreshSheet();
        case 'plus':
          if (!canOrder(b.dataset.id)) return render();
          if (isCombo(P.findItem(menu, b.dataset.id))) { sheetMode = null; return openCustom(b.dataset.id); }
          l = lineByKey(b.dataset.id);
          if (l) l.qty = Math.min(20, l.qty + 1);
          else cart.push({ key: b.dataset.id, pid: b.dataset.id, qty: 1, mods: [], note: '' });
          break;
        case 'inc':
          l = lineByKey(b.dataset.key);
          if (l) l.qty = Math.min(20, l.qty + 1);
          break;
        case 'minus':
          l = lineByKey(b.dataset.key);
          if (l) { l.qty--; if (l.qty <= 0) cart.splice(cart.indexOf(l), 1); }
          break;
        case 'custom': if (!canOrder(b.dataset.id)) return; sheetMode = null; return openCustom(b.dataset.id);
        case 'mod': sheetMode.sel[b.dataset.id] = !sheetMode.sel[b.dataset.id]; return openCustom(sheetMode.pid);
        case 'cqty': sheetMode.qty = Math.min(20, Math.max(1, sheetMode.qty + Number(b.dataset.d))); return openCustom(sheetMode.pid);
        case 'pick':
          var pk = sheetMode.picks[+b.dataset.c], oi = +b.dataset.o;
          var need = Number(P.findItem(menu, sheetMode.pid).combo.courses[+b.dataset.c].pick) || 1;
          if (pk.indexOf(oi) >= 0) pk.splice(pk.indexOf(oi), 1); else { if (pk.length >= need) pk.shift(); pk.push(oi); }
          return openCustom(sheetMode.pid);
        case 'cadd':
          var st = sheetMode;
          var ids = Object.keys(st.sel).filter(function (k) { return st.sel[k]; });
          var n = st.note.trim().slice(0, 80);
          var cit = P.findItem(menu, st.pid);
          if (isCombo(cit)) {
            if (!P.comboComplete(cit, st.picks)) return;
            cart.push({ key: st.pid + '~' + Store.newId(), pid: st.pid, qty: st.qty, mods: [], note: n, combo: st.picks });
          } else if (!ids.length && !n) {
            l = lineByKey(st.pid);
            if (l) l.qty = Math.min(20, l.qty + st.qty);
            else cart.push({ key: st.pid, pid: st.pid, qty: st.qty, mods: [], note: '' });
          } else {
            cart.push({ key: st.pid + '~' + Store.newId(), pid: st.pid, qty: st.qty, mods: ids, note: n });
          }
          closeSheet(); render(); return;
        case 'close': return closeSheet();
        case 'send':
          if (!P.qrStatus(qrCfg).open || validLines().some(function (x) { return !canOrder(x.pid); })) { closeSheet(); return render(); }
          b.disabled = true;
          b.textContent = t('c.sending');
          send('order', validLines().map(function (x) {
            return { pid: x.pid, name: P.findItem(menu, x.pid).name, qty: x.qty, mods: x.mods, note: x.note, combo: x.combo || null };
          })).then(function (ok) {
            if (!ok) { b.disabled = false; b.textContent = t('c.send'); return; }
            cart = []; note = ''; closeSheet(); render();
          });
          return;
        case 'waiter': case 'bill':
          if (confirm(t(a === 'bill' ? 'c.confirmBill' : 'c.confirmWaiter'))) {
            send(a).then(function (ok) { if (ok) toast(t('c.sent')); });
          }
          return;
      }
      render();
      if (sheetMode === 'cart') openCart();
    });

    var tt;
    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg; el.classList.remove('hidden');
      clearTimeout(tt); tt = setTimeout(function () { el.classList.add('hidden'); }, 3000);
    }

    if (Store.mode === 'local') console.warn('Modo local: los pedidos solo llegan al TPV si se abre en el mismo navegador.');
  })();
  </script>
</body>
