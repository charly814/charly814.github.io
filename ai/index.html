<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 工作台 · 多智能体协作</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #f4f5f8; --panel: #ffffff; --ink: #1d2230; --muted: #6b7280;
    --line: #e3e6ec; --accent: #4f46e5; --accent-ink: #fff; --soft: #eef0ff;
    --danger: #dc2626; --ok: #059669; --code: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12141a; --panel: #1b1e27; --ink: #e6e8ee; --muted: #9aa1ae;
      --line: #2c303c; --accent: #818cf8; --accent-ink: #11121a; --soft: #232742;
      --danger: #f87171; --ok: #34d399; --code: #232632;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  aside {
    background: var(--panel); border-right: 1px solid var(--line);
    overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px;
  }
  main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
  h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .section { display: flex; flex-direction: column; gap: 8px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input[type=text], input[type=password], input[type=number], select, textarea {
    width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg);
  }
  textarea { resize: vertical; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row > * { flex: 1; }
  .btn {
    border: 1px solid var(--line); background: var(--panel); border-radius: 8px;
    padding: 7px 12px; cursor: pointer; white-space: nowrap; flex: 0 0 auto;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .hint { font-size: 12px; color: var(--muted); margin: 0; }
  .agent {
    border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 10px;
    padding: 10px; display: flex; flex-direction: column; gap: 6px; background: var(--bg);
  }
  .agent .head { display: flex; gap: 6px; align-items: center; }
  .agent .head input.emoji { width: 42px; text-align: center; flex: 0 0 auto; }
  .agent .head input.name { flex: 1; font-weight: 600; }
  .agent .head input[type=color] { width: 30px; height: 30px; padding: 0; border: none; background: none; flex: 0 0 auto; }
  .agent textarea { min-height: 70px; font-size: 13px; }
  .agent .tools { display: flex; gap: 4px; }
  .agent .tools .btn { padding: 4px 8px; font-size: 12px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .modes button { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 8px 4px; cursor: pointer; font-size: 13px; }
  .modes button.on { border-color: var(--accent); background: var(--soft); font-weight: 600; }
  header.top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  .status { font-size: 13px; color: var(--muted); }
  .status.live::before { content: "●"; color: var(--ok); margin-right: 6px; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #feed { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 460px; }
  .empty .big { font-size: 42px; }
  .msg { display: flex; gap: 10px; max-width: 920px; width: 100%; margin: 0 auto; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex: 0 0 36px;
    display: grid; place-items: center; font-size: 18px; background: var(--c); color: #fff;
  }
  .bubble { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .bubble .who { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
  .bubble .who b { color: var(--ink); font-size: 13px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: var(--soft); color: var(--accent); }
  .msg.user .bubble { background: var(--soft); }
  .msg.system .bubble { background: transparent; border-style: dashed; font-size: 13px; color: var(--muted); }
  .msg.error .bubble { border-color: var(--danger); color: var(--danger); }
  .body { overflow-wrap: anywhere; }
  .body > :first-child { margin-top: 0; } .body > :last-child { margin-bottom: 0; }
  .body pre { background: var(--code); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .body code { background: var(--code); padding: 1px 4px; border-radius: 4px; font-size: 12.5px; }
  .body pre code { background: none; padding: 0; }
  .body table { border-collapse: collapse; } .body td, .body th { border: 1px solid var(--line); padding: 4px 8px; }
  .typing::after { content: "▍"; animation: blink 1s infinite; color: var(--accent); }
  footer.composer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 20px; }
  footer.composer .inner { max-width: 920px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  footer.composer textarea { min-height: 56px; max-height: 220px; }
  .mobile-toggle { display: none; }
  @media (max-width: 820px) {
    .app { grid-template-columns: 1fr; }
    aside { position: fixed; inset: 0 15% 0 0; z-index: 10; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
    aside.open { transform: none; }
    .mobile-toggle { display: inline-block; }
    header.top, #feed, footer.composer { padding-left: 16px; padding-right: 16px; }
    footer.composer .inner { flex-wrap: wrap; }
    footer.composer textarea { flex: 1 1 100%; }
    footer.composer .btn { flex: 1; }
    #exportBtn { display: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <h1>🧠 AI 工作台</h1>

    <div class="section">
      <h2>连接</h2>
      <label class="f">Anthropic API Key
        <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
      </label>
      <p class="hint">Key 只保存在本浏览器（localStorage），直接从浏览器发送到 api.anthropic.com，不经过任何其他服务器。请勿在公共电脑上使用。</p>
      <label class="f">思考深度 (effort)
        <select id="effort">
          <option value="low">low · 快、省</option>
          <option value="medium" selected>medium · 均衡</option>
          <option value="high">high · 更深入</option>
          <option value="xhigh">xhigh · 很深入</option>
        </select>
      </label>
    </div>

    <div class="section">
      <h2>协作模式</h2>
      <div class="modes" id="modes">
        <button data-mode="pipeline">🔗 流水线</button>
        <button data-mode="roundtable">💬 圆桌讨论</button>
        <button data-mode="supervisor">🎯 主管调度</button>
      </div>
      <p class="hint" id="modeHint"></p>
      <div class="row" id="roundsRow">
        <label class="f">讨论轮数 <input id="rounds" type="number" min="1" max="6" value="2"></label>
      </div>
      <div class="row" id="stepsRow">
        <label class="f">最多调度步数 <input id="maxSteps" type="number" min="1" max="20" value="6"></label>
      </div>
    </div>

    <div class="section">
      <h2>团队模板</h2>
      <div class="row">
        <select id="preset"></select>
        <button class="btn" id="applyPreset">载入</button>
      </div>
    </div>

    <div class="section">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">智能体 (<span id="agentCount">0</span>)</h2>
        <button class="btn" id="addAgent" style="flex:0 0 auto">＋ 添加</button>
      </div>
      <p class="hint">第一个智能体是「组长」：在圆桌模式里做总结，在主管模式里负责分派任务和最终汇总。用 ↑↓ 调整顺序。</p>
      <div id="agents" class="section"></div>
    </div>
  </aside>

  <main>
    <header class="top">
      <div class="row" style="flex:1; gap:10px">
        <button class="btn mobile-toggle" id="menuBtn">☰ 设置</button>
        <span class="status" id="status">就绪</span>
      </div>
      <div class="row" style="flex:0 0 auto">
        <button class="btn" id="exportBtn">⬇ 导出 Markdown</button>
        <button class="btn danger" id="clearBtn">🗑 新会话</button>
      </div>
    </header>
    <div id="feed"></div>
    <footer class="composer">
      <div class="inner">
        <textarea id="task" placeholder="描述任务，例如：为一家西班牙中餐厅写一份小红书推广方案（Ctrl/⌘ + Enter 发送）"></textarea>
        <button class="btn primary" id="runBtn">▶ 开始协作</button>
        <button class="btn danger" id="stopBtn" disabled>■ 停止</button>
      </div>
    </footer>
  </main>
</div>

<script type="module">
import Anthropic from "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm";

// ---------- 常量 ----------
const MODELS = [
  { id: "claude-opus-5-5",   label: "Opus 5.5（默认，强）" },
  { id: "claude-sonnet-5-5", label: "Sonnet 5.5（快、便宜）" },
  { id: "claude-haiku-5-5",  label: "Haiku 5.5（最便宜）" },
  { id: "claude-fable-5-2",  label: "Fable 5.2（最强，贵）" },
];
// 这些模型支持服务端拒答回退（refusal fallback）
const FALLBACK_MODELS = new Set(["claude-opus-5-5", "claude-sonnet-5-5", "claude-fable-5-2"]);
const COLORS = ["#4f46e5", "#0891b2", "#059669", "#d97706", "#db2777", "#7c3aed", "#dc2626", "#65a30d"];

const PRESETS = {
  content: {
    name: "✍️ 内容创作团队",
    agents: [
      { name: "主编", emoji: "🧭", role: "你是主编，负责理解需求、拆解任务、把控方向，并在最后整合团队成果，输出一份完整、可直接使用的最终稿。" },
      { name: "策划", emoji: "💡", role: "你是创意策划。根据任务提出清晰的选题角度、目标受众、核心卖点和内容结构大纲。要具体，不要空话。" },
      { name: "写手", emoji: "✍️", role: "你是资深写手。根据策划的大纲写出完整正文，语言生动、有画面感，符合目标平台的风格。" },
      { name: "审稿人", emoji: "🔍", role: "你是严格的审稿人。指出前面内容的问题（事实、逻辑、语气、结构），并给出具体修改建议和修改后的关键段落。" },
    ],
  },
  dev: {
    name: "💻 软件开发团队",
    agents: [
      { name: "技术负责人", emoji: "🧭", role: "你是技术负责人，负责拆解需求、分派工作，并最终整合出一份完整的技术方案与实现。" },
      { name: "产品经理", emoji: "📋", role: "你是产品经理。把需求整理成清晰的用户故事、功能列表和验收标准，指出边界情况。" },
      { name: "架构师", emoji: "🏗️", role: "你是软件架构师。给出技术选型、模块划分、数据结构和接口设计，说明权衡取舍。" },
      { name: "工程师", emoji: "👩‍💻", role: "你是高级工程师。根据设计写出可运行的核心代码，代码要完整、有注释。" },
      { name: "测试", emoji: "🧪", role: "你是测试工程师。审查方案和代码，找出 bug 与风险，写出测试用例。" },
    ],
  },
  debate: {
    name: "⚖️ 决策辩论",
    agents: [
      { name: "裁判", emoji: "⚖️", role: "你是中立的裁判和决策顾问。主持讨论，最后权衡双方论点，给出明确的结论、理由和下一步行动建议。" },
      { name: "正方", emoji: "👍", role: "你支持这个提议。给出最有力的论据和数据，并回应反方的质疑。保持简洁有力。" },
      { name: "反方", emoji: "👎", role: "你反对这个提议（或指出它的风险）。给出最有力的反对论据，并回应正方的观点。保持简洁有力。" },
    ],
  },
  research: {
    name: "🔬 研究分析团队",
    agents: [
      { name: "首席分析师", emoji: "🧭", role: "你是首席分析师，负责规划研究框架、协调团队，最后写出结构清晰的研究报告（含结论与建议）。" },
      { name: "行业研究员", emoji: "📊", role: "你是行业研究员。从市场规模、竞争格局、趋势等角度分析，给出你所知道的事实与数据，并标注不确定之处。" },
      { name: "用户研究员", emoji: "🧑‍🤝‍🧑", role: "你是用户研究员。分析目标用户画像、需求痛点与行为动机。" },
      { name: "风险评估师", emoji: "🛡️", role: "你是风险评估师。识别法律、财务、运营等方面的风险，并提出应对措施。" },
    ],
  },
};

const MODE_HINTS = {
  pipeline: "按顺序接力：每个智能体都能看到任务和前面所有人的产出，在此基础上完成自己的部分。",
  roundtable: "所有智能体轮流发言、互相回应，进行多轮讨论，最后由组长总结。",
  supervisor: "组长作为主管，每一步决定下一个由谁做什么，直到任务完成，再由组长汇总最终答案。",
};

// ---------- 状态 ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("aiwb." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("aiwb." + k, JSON.stringify(v)); } catch {} },
};
let agents = store.get("agents", null) || presetAgents("content");
let transcript = store.get("transcript", []);   // {kind:'user'|'agent'|'system'|'error', agentId?, name?, text, tag?}
let mode = store.get("mode", "pipeline");
let running = false;
let controllers = [];

function uid() { return Math.random().toString(36).slice(2, 9); }
function presetAgents(key) {
  return PRESETS[key].agents.map((a, i) => ({ id: uid(), model: "claude-opus-5-5", color: COLORS[i % COLORS.length], ...a }));
}

// ---------- DOM ----------
const $ = (s) => document.querySelector(s);
const feed = $("#feed");
const apiKeyEl = $("#apiKey"), effortEl = $("#effort");
apiKeyEl.value = store.get("apiKey", "");
effortEl.value = store.get("effort", "medium");
$("#rounds").value = store.get("rounds", 2);
$("#maxSteps").value = store.get("maxSteps", 6);
apiKeyEl.addEventListener("change", () => store.set("apiKey", apiKeyEl.value.trim()));
effortEl.addEventListener("change", () => store.set("effort", effortEl.value));
$("#rounds").addEventListener("change", (e) => store.set("rounds", +e.target.value));
$("#maxSteps").addEventListener("change", (e) => store.set("maxSteps", +e.target.value));
$("#menuBtn").addEventListener("click", (e) => { e.stopPropagation(); $("#side").classList.toggle("open"); });
document.querySelector("main").addEventListener("click", () => $("#side").classList.remove("open"));

for (const [k, p] of Object.entries(PRESETS)) {
  const o = document.createElement("option"); o.value = k; o.textContent = p.name; $("#preset").append(o);
}
$("#applyPreset").addEventListener("click", () => {
  if (running) return;
  agents = presetAgents($("#preset").value);
  if ($("#preset").value === "debate") setMode("roundtable");
  saveAgents(); renderAgents();
});

function setMode(m) {
  mode = m; store.set("mode", m);
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.mode === m));
  $("#modeHint").textContent = MODE_HINTS[m];
  $("#roundsRow").style.display = m === "roundtable" ? "" : "none";
  $("#stepsRow").style.display = m === "supervisor" ? "" : "none";
}
document.querySelectorAll("#modes button").forEach((b) => b.addEventListener("click", () => !running && setMode(b.dataset.mode)));
setMode(mode);

function saveAgents() { store.set("agents", agents); $("#agentCount").textContent = agents.length; }

function renderAgents() {
  const box = $("#agents"); box.innerHTML = "";
  agents.forEach((a, i) => {
    const el = document.createElement("div");
    el.className = "agent"; el.style.setProperty("--c", a.color);
    el.innerHTML = `
      <div class="head">
        <input class="emoji" type="text" maxlength="4">
        <input class="name" type="text" placeholder="名字">
        <input type="color">
      </div>
      <select class="model">${MODELS.map((m) => `<option value="${m.id}">${m.label}</option>`).join("")}</select>
      <textarea class="role" placeholder="角色设定（系统提示词）"></textarea>
      <div class="tools">
        ${i === 0 ? '<span class="tag">组长</span>' : ""}
        <span style="flex:1"></span>
        <button class="btn up" ${i === 0 ? "disabled" : ""}>↑</button>
        <button class="btn down" ${i === agents.length - 1 ? "disabled" : ""}>↓</button>
        <button class="btn danger del" ${agents.length <= 1 ? "disabled" : ""}>删除</button>
      </div>`;
    const q = (s) => el.querySelector(s);
    q(".emoji").value = a.emoji; q(".name").value = a.name; q("input[type=color]").value = a.color;
    q(".model").value = a.model; q(".role").value = a.role;
    q(".emoji").oninput = (e) => { a.emoji = e.target.value; saveAgents(); };
    q(".name").oninput = (e) => { a.name = e.target.value; saveAgents(); };
    q("input[type=color]").oninput = (e) => { a.color = e.target.value; el.style.setProperty("--c", a.color); saveAgents(); };
    q(".model").onchange = (e) => { a.model = e.target.value; saveAgents(); };
    q(".role").oninput = (e) => { a.role = e.target.value; saveAgents(); };
    q(".up").onclick = () => { [agents[i - 1], agents[i]] = [agents[i], agents[i - 1]]; saveAgents(); renderAgents(); };
    q(".down").onclick = () => { [agents[i + 1], agents[i]] = [agents[i], agents[i + 1]]; saveAgents(); renderAgents(); };
    q(".del").onclick = () => { agents.splice(i, 1); saveAgents(); renderAgents(); };
    box.append(el);
  });
  saveAgents();
}
$("#addAgent").addEventListener("click", () => {
  agents.push({ id: uid(), name: "新成员", emoji: "🤖", model: "claude-opus-5-5", color: COLORS[agents.length % COLORS.length], role: "你是……（描述这个智能体的职责和风格）" });
  renderAgents();
});
renderAgents();

// ---------- 渲染消息 ----------
function md(text) { return DOMPurify.sanitize(marked.parse(text || "")); }

function renderFeed() {
  feed.innerHTML = "";
  if (!transcript.length) {
    feed.innerHTML = `<div class="empty"><div class="big">🤝</div>
      <p><b>多个 AI 智能体，一起完成你的任务。</b></p>
      <p>左侧填入 API Key、选择协作模式和团队，然后在下方输入任务。</p></div>`;
    return;
  }
  transcript.forEach((m) => feed.append(msgEl(m)));
  feed.scrollTop = feed.scrollHeight;
}

function msgEl(m) {
  const el = document.createElement("div");
  el.className = "msg " + (m.kind === "agent" ? "" : m.kind);
  const a = m.agentId && agents.find((x) => x.id === m.agentId);
  const color = m.color || a?.color || "#6b7280";
  const emoji = m.kind === "user" ? "🙂" : m.kind === "system" ? "⚙️" : m.kind === "error" ? "⚠️" : (m.emoji || a?.emoji || "🤖");
  const name = m.kind === "user" ? "你" : m.kind === "system" ? "调度" : m.kind === "error" ? "错误" : (m.name || a?.name);
  el.style.setProperty("--c", color);
  el.innerHTML = `<div class="avatar"></div><div class="bubble"><div class="who"><b></b></div><div class="body"></div></div>`;
  el.querySelector(".avatar").textContent = emoji;
  el.querySelector(".who b").textContent = name;
  if (m.tag) { const t = document.createElement("span"); t.className = "tag"; t.textContent = m.tag; el.querySelector(".who").append(t); }
  el.querySelector(".body").innerHTML = md(m.text);
  m._el = el;
  return el;
}

function push(m) {
  if (!transcript.length) feed.innerHTML = "";
  transcript.push(m);
  feed.append(msgEl(m));
  feed.scrollTop = feed.scrollHeight;
  persist();
  return m;
}
function persist() { store.set("transcript", transcript.map(({ _el, ...rest }) => rest)); }

let rafPending = false;
function updateMsg(m) {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => {
    rafPending = false;
    const body = m._el.querySelector(".body");
    body.innerHTML = md(m.text);
    body.classList.toggle("typing", !!m.streaming);
    const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 200;
    if (nearBottom) feed.scrollTop = feed.scrollHeight;
  });
}

function setStatus(t, live) { const s = $("#status"); s.textContent = t; s.classList.toggle("live", !!live); }

// ---------- 调用 Claude ----------
function client() {
  const key = apiKeyEl.value.trim();
  if (!key) throw new Error("请先在左侧填入 Anthropic API Key。");
  store.set("apiKey", key);
  return new Anthropic({ apiKey: key, dangerouslyAllowBrowser: true });
}

function teamRoster() {
  return agents.map((a, i) => `- ${a.name}${i === 0 ? "（组长）" : ""}：${a.role}`).join("\n");
}

// 把整个会话记录整理成一段上下文，交给某个智能体
function transcriptText() {
  return transcript
    .filter((m) => m.kind === "user" || m.kind === "agent")
    .map((m) => (m.kind === "user" ? `【用户】\n${m.text}` : `【${m.name}】\n${m.text}`))
    .join("\n\n---\n\n");
}

function systemFor(agent) {
  return `${agent.role}

你是一个多智能体团队中的成员「${agent.name}」。团队成员如下：
${teamRoster()}

协作规则：
- 只完成属于你职责的部分，在别人已有成果的基础上推进，不要重复别人说过的内容。
- 直接给出内容，不要自我介绍，不要冒充其他成员发言。
- 使用与用户相同的语言回答，可以使用 Markdown。`;
}

async function callAgent(agent, instruction, opts = {}) {
  const c = client();
  const context = transcriptText();   // 在加入本条消息之前取上下文
  const msg = push({ kind: "agent", agentId: agent.id, name: agent.name, emoji: agent.emoji, color: agent.color, text: "", streaming: true, tag: opts.tag });
  const ctrl = new AbortController(); controllers.push(ctrl);
  setStatus(`${agent.emoji} ${agent.name} 正在工作…`, true);
  const params = {
    model: agent.model,
    max_tokens: 32000,
    system: systemFor(agent),
    output_config: { effort: effortEl.value },
    messages: [{ role: "user", content: `以下是目前为止的协作记录：\n\n${context || "（暂无）"}\n\n======\n\n${instruction}` }],
  };
  if (FALLBACK_MODELS.has(agent.model)) {
    params.betas = ["server-side-fallback-2026-07-01"];
    params.fallbacks = "default";
  }
  try {
    const stream = c.beta.messages.stream(params, { signal: ctrl.signal });
    stream.on("text", (d) => { msg.text += d; updateMsg(msg); });
    const final = await stream.finalMessage();
    if (final.stop_reason === "refusal") msg.text += "\n\n> ⚠️ 模型拒绝了这个请求。";
    if (final.stop_reason === "max_tokens") msg.text += "\n\n> ⚠️ 输出达到长度上限，被截断。";
    return msg.text;
  } finally {
    msg.streaming = false; updateMsg(msg); persist();
    controllers = controllers.filter((x) => x !== ctrl);
  }
}

// 主管：用结构化输出决定下一步
async function decideNext(lead, step, maxSteps) {
  const c = client();
  const names = agents.slice(1).map((a) => a.name);
  const ctrl = new AbortController(); controllers.push(ctrl);
  setStatus(`${lead.emoji} ${lead.name} 正在分派任务…`, true);
  try {
    const res = await c.beta.messages.create({
      model: lead.model,
      max_tokens: 4000,
      system: systemFor(lead) + `\n\n你现在是主管。你的工作是决定下一步由哪位成员做什么，而不是自己完成任务。可选成员：${names.join("、")}。当成果已经足够完成用户的任务时，选择 FINISH。`,
      output_config: {
        effort: "low",
        format: {
          type: "json_schema",
          schema: {
            type: "object",
            properties: {
              next: { type: "string", enum: [...names, "FINISH"], description: "下一个发言的成员，或 FINISH" },
              instruction: { type: "string", description: "给该成员的具体指令" },
              reason: { type: "string", description: "一句话说明为什么" },
            },
            required: ["next", "instruction", "reason"],
            additionalProperties: false,
          },
        },
      },
      messages: [{ role: "user", content: `协作记录：\n\n${transcriptText()}\n\n======\n\n这是第 ${step}/${maxSteps} 步。请决定下一步。` }],
    }, { signal: ctrl.signal });
    if (res.stop_reason === "refusal") throw new Error("主管模型拒绝了这个请求。");
    const text = res.content.filter((b) => b.type === "text").map((b) => b.text).join("");
    return JSON.parse(text);
  } finally {
    controllers = controllers.filter((x) => x !== ctrl);
  }
}

// ---------- 协作流程 ----------
async function runPipeline() {
  for (let i = 0; i < agents.length; i++) {
    if (!running) return;
    const a = agents[i];
    const isLast = i === agents.length - 1;
    await callAgent(a, isLast
      ? `你是流水线的最后一步（第 ${i + 1}/${agents.length} 步）。请完成你的部分，并确保最终成果完整可用。`
      : `你是流水线的第 ${i + 1}/${agents.length} 步。请基于以上内容完成你负责的部分，下一位是「${agents[i + 1].name}」。`,
      { tag: `步骤 ${i + 1}` });
  }
}

async function runRoundtable() {
  const rounds = Math.max(1, Math.min(6, +$("#rounds").value || 2));
  for (let r = 1; r <= rounds; r++) {
    for (const a of agents) {
      if (!running) return;
      await callAgent(a, r === 1
        ? `这是圆桌讨论的第 1/${rounds} 轮。请从你的角色出发发表观点。`
        : `这是圆桌讨论的第 ${r}/${rounds} 轮。请回应其他成员的观点（同意、反驳或补充），推进讨论，不要重复。`,
        { tag: `第 ${r} 轮` });
    }
  }
  if (!running) return;
  await callAgent(agents[0], "讨论结束。请作为组长总结各方观点，给出最终的结论 / 完整成果。", { tag: "总结" });
}

async function runSupervisor() {
  const lead = agents[0];
  if (agents.length < 2) throw new Error("主管模式至少需要 2 个智能体。");
  const maxSteps = Math.max(1, Math.min(20, +$("#maxSteps").value || 6));
  for (let step = 1; step <= maxSteps; step++) {
    if (!running) return;
    const d = await decideNext(lead, step, maxSteps);
    if (d.next === "FINISH") { push({ kind: "system", text: `**${lead.name}** 判断任务已完成：${d.reason}` }); break; }
    const worker = agents.find((a) => a.name === d.next);
    if (!worker) { push({ kind: "system", text: `找不到成员「${d.next}」，结束调度。` }); break; }
    push({ kind: "system", text: `**${lead.name}** → **${worker.name}**：${d.instruction}\n\n<small>理由：${d.reason}</small>` });
    await callAgent(worker, `主管「${lead.name}」给你的指令：${d.instruction}`, { tag: `第 ${step} 步` });
  }
  if (!running) return;
  await callAgent(lead, "请作为组长汇总团队的全部成果，输出最终的完整答案。", { tag: "最终答案" });
}

async function run() {
  const task = $("#task").value.trim();
  if (!task || running) return;
  try { client(); } catch (e) { alert(e.message); return; }
  running = true;
  $("#runBtn").disabled = true; $("#stopBtn").disabled = false;
  $("#side").classList.remove("open");
  push({ kind: "user", text: task });
  $("#task").value = "";
  try {
    if (mode === "pipeline") await runPipeline();
    else if (mode === "roundtable") await runRoundtable();
    else await runSupervisor();
    setStatus(running ? "✅ 完成" : "已停止");
  } catch (e) {
    if (e?.name === "AbortError" || e instanceof Anthropic.APIUserAbortError) setStatus("已停止");
    else { push({ kind: "error", text: errText(e) }); setStatus("出错了"); }
  } finally {
    running = false;
    $("#runBtn").disabled = false; $("#stopBtn").disabled = true;
    $("#runBtn").textContent = "▶ 继续协作";
  }
}

function errText(e) {
  if (e instanceof Anthropic.AuthenticationError) return "API Key 无效（401），请检查左侧的 Key。";
  if (e instanceof Anthropic.PermissionDeniedError) return "没有权限使用该模型（403）：" + e.message;
  if (e instanceof Anthropic.NotFoundError) return "模型不存在或不可用（404）：" + e.message;
  if (e instanceof Anthropic.RateLimitError) return "请求过于频繁或额度不足（429），稍后再试。";
  if (e instanceof Anthropic.APIConnectionError) return "网络连接失败，请检查网络。";
  if (e instanceof Anthropic.APIError) return `API 错误 ${e.status ?? ""}：${e.message}`;
  return String(e?.message || e);
}

$("#runBtn").addEventListener("click", run);
$("#task").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });
$("#stopBtn").addEventListener("click", () => { running = false; controllers.forEach((c) => c.abort()); });
$("#clearBtn").addEventListener("click", () => {
  if (running || (transcript.length && !confirm("清空当前会话？"))) return;
  transcript = []; persist(); renderFeed(); setStatus("就绪"); $("#runBtn").textContent = "▶ 开始协作";
});
$("#exportBtn").addEventListener("click", () => {
  const text = transcript.map((m) =>
    m.kind === "user" ? `## 🙂 用户\n\n${m.text}` :
    m.kind === "agent" ? `## ${m.emoji || ""} ${m.name}${m.tag ? `（${m.tag}）` : ""}\n\n${m.text}` :
    `> ${m.text.replace(/\n/g, "\n> ")}`).join("\n\n");
  const blob = new Blob([`# AI 工作台记录\n\n${text}\n`], { type: "text/markdown" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = `ai-workbench-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.md`;
  a.click(); URL.revokeObjectURL(a.href);
});

if (transcript.length) $("#runBtn").textContent = "▶ 继续协作";
renderFeed();
</script>
</body>
</html>
