<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1f5f8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>收租管家</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#1d2733; --muted:#6b7785; --line:#e1e6ec;
  --pri:#1f5f8b; --pri-ink:#fff; --pri-soft:#e6f0f7;
  --ok:#1e8a4c; --ok-soft:#e3f4ea; --warn:#b26a00; --warn-soft:#fdf1dc;
  --bad:#c0392b; --bad-soft:#fbe5e2; --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI",sans-serif;font-size:15px;line-height:1.45}
header.top{background:var(--pri);color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 1px 4px rgba(0,0,0,.15)}
header.top .bar{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.5px}
header.top .who{margin-left:auto;font-size:13px;opacity:.85}
nav.tabs{max-width:1100px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:#dbe8f2;text-decoration:none;padding:9px 12px;white-space:nowrap;border-bottom:3px solid transparent;font-size:14px}
nav.tabs a.on{color:#fff;border-bottom-color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:18px;margin:4px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.right{text-align:right}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.ok .v{color:var(--ok)} .stat.bad .v{color:var(--bad)} .stat.warn .v{color:var(--warn)}
button,.btn{font:inherit;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:#b9c4cf}
button.pri,.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.danger{color:var(--bad);border-color:#ecc3bd}
button.sm{padding:4px 9px;font-size:13px}
button.link{border:none;background:none;color:var(--pri);padding:2px 4px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:20px;background:#eef1f4;color:var(--muted);white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.pri{background:var(--pri-soft);color:var(--pri)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #cbd3dc;border-radius:7px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:60px;resize:vertical}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:10px}
label.f > input,label.f > select,label.f > textarea{margin-top:3px}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:10px}
label.chk input{width:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 12px}
@media (max-width:600px){.grid2,.grid3{grid-template-columns:1fr}}
.prop{border-left:4px solid var(--pri)}
.prop.garage{border-left-color:#8a5a1e}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.file{border:1px solid var(--line);border-radius:7px;padding:4px;width:92px;font-size:11px;text-align:center;background:#fafbfc;cursor:pointer;position:relative}
.file img{width:82px;height:62px;object-fit:cover;border-radius:4px;display:block;margin:0 auto 3px}
.file .ic{height:62px;display:flex;align-items:center;justify-content:center;font-size:26px}
.file .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .x{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:1px solid #ecc3bd;background:#fff;color:var(--bad);font-size:12px;line-height:17px;padding:0;text-align:center}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,25,35,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal.wide{max-width:900px}
.modal .mh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .mh b{font-size:16px}
.modal .mh button{margin-left:auto}
.modal .mb{padding:16px}
.modal .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:9px 16px;border-radius:8px;z-index:90;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:80;display:flex;flex-direction:column}
.viewer .vt{color:#fff;padding:10px 14px;display:flex;gap:10px;align-items:center}
.viewer .vt span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vb{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:10px}
.viewer img{max-width:100%;max-height:100%}
.viewer iframe{width:100%;height:100%;border:0;background:#fff}
.items td input{padding:5px 7px}
.sum-line{display:flex;justify-content:space-between;padding:4px 0}
.sum-line.total{font-weight:700;font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:8px}

/* ---------- receipt ---------- */
#print{display:none}
.rc-preview{background:#e9edf1;padding:14px;border-radius:8px;overflow-x:auto}
.rc-page{background:#fff;width:190mm;margin:0 auto;padding:0;color:#000}
.rc{border:1.5px solid #000;padding:5mm 7mm;font-family:"Songti SC","SimSun","Noto Serif SC","Times New Roman",serif;font-size:10.5pt;line-height:1.3;position:relative;min-height:112mm;display:flex;flex-direction:column;page-break-inside:avoid;break-inside:avoid}
.rc .copy{position:absolute;top:4mm;right:6mm;font-size:9.5pt;border:1px solid #000;padding:0 2mm}
.rc .ttl{text-align:center;font-size:15pt;font-weight:700;letter-spacing:6px;margin:0 0 1mm}
.rc .ttl small{display:block;font-size:10pt;letter-spacing:1px;font-weight:400}
.rc .meta{display:flex;justify-content:space-between;font-size:10pt;margin:1mm 0 2mm}
.rc .no{color:#b00;font-weight:700}
.rc p.l{margin:0 0 1.5mm}
.rc .u{border-bottom:1px solid #000;padding:0 2mm;display:inline-block;min-width:30mm}
.rc table{width:100%;border-collapse:collapse;font-size:10pt;margin:1mm 0 1.5mm}
.rc th,.rc td{border:1px solid #000;padding:.8mm 2mm;color:#000;line-height:1.25}
.rc th{font-size:10pt;font-weight:600;background:#f2f2f2}
.rc td.num{text-align:right}
.rc .words{margin:1mm 0 2mm}
.rc .foot{margin-top:auto;padding-top:2mm;display:flex;gap:6mm;justify-content:space-between;align-items:flex-end;font-size:10.5pt}
.rc .sig{min-width:60mm;text-align:center}
.rc .sig .line{border-bottom:1px solid #000;height:11mm;display:flex;align-items:flex-end;justify-content:center}
.rc .sig img{max-height:14mm;max-width:55mm}
.rc .lr{font-size:9.5pt;line-height:1.35}
.cut{height:7mm;display:flex;align-items:center;font-size:9pt;color:#555;gap:3mm}
.cut::before,.cut::after{content:"";flex:1;border-top:1px dashed #777}
.rc .stamp{position:absolute;right:14mm;bottom:21mm;border:2.5px solid #c00;color:#c00;font-weight:700;font-size:15pt;padding:1mm 4mm;transform:rotate(-12deg);opacity:.75;letter-spacing:2px}
@media print{
  @page{size:A4;margin:8mm 10mm}
  body{background:#fff}
  body > *:not(#print){display:none !important}
  #print{display:block}
  .rc-page{width:auto;page-break-after:always}
  .rc-page:last-child{page-break-after:auto}
  .rc th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar"><h1>🏠 收租管家</h1><span class="who" id="who"></span></div>
  <nav class="tabs" id="tabs">
    <a href="#home" data-v="home">概览</a>
    <a href="#rent" data-v="rent">收租</a>
    <a href="#bills" data-v="bills">水电费 / 账单</a>
    <a href="#props" data-v="props">房产与租客</a>
    <a href="#receipts" data-v="receipts">收据</a>
    <a href="#report" data-v="report">报表</a>
    <a href="#settings" data-v="settings">设置 / 备份</a>
  </nav>
</header>
<main id="app"></main>
<div id="print"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =====================================================================
   收租管家 — 单页应用，数据保存在本浏览器（localStorage + IndexedDB）
   ===================================================================== */
const KEY = 'zuqi-data-v1';
const BILL_TYPES = {
  electric:{zh:'电费',es:'Electricidad',unit:'kWh',ic:'⚡'},
  water:{zh:'水费',es:'Agua',unit:'m³',ic:'💧'},
  gas:{zh:'燃气费',es:'Gas',unit:'m³',ic:'🔥'},
  internet:{zh:'网费',es:'Internet',unit:'',ic:'🌐'},
  community:{zh:'物业/社区费',es:'Comunidad',unit:'',ic:'🏢'},
  ibi:{zh:'房产税 IBI',es:'IBI',unit:'',ic:'🏛️'},
  basura:{zh:'垃圾费',es:'Basuras',unit:'',ic:'🗑️'},
  insurance:{zh:'保险',es:'Seguro',unit:'',ic:'🛡️'},
  repair:{zh:'维修',es:'Reparación',unit:'',ic:'🔧'},
  other:{zh:'其他',es:'Otros',unit:'',ic:'📄'}
};
const METHODS = {cash:{zh:'现金',es:'Efectivo'},transfer:{zh:'银行转账',es:'Transferencia'},bizum:{zh:'Bizum',es:'Bizum'},card:{zh:'刷卡',es:'Tarjeta'},other:{zh:'其他',es:'Otro'}};
const KINDS = {rent:{zh:'租金',es:'Alquiler'},deposit:{zh:'押金',es:'Fianza'},other:{zh:'其他收款',es:'Otro cobro'}};
const LANGS = {'zh-es':{zh:'中文 + 西班牙语',tag:'中+西'},zh:{zh:'仅中文',tag:'中文'},es:{zh:'仅西班牙语',tag:'西语'}};
const PTYPES = {house:{zh:'住房',es:'Vivienda',ic:'🏠'},garage:{zh:'车库/车位',es:'Plaza de garaje',ic:'🚗'},shop:{zh:'商铺',es:'Local',ic:'🏪'},other:{zh:'其他',es:'Otro',ic:'📦'}};

let D = load();
function blank(){
  return {properties:[],contracts:[],bills:[],payments:[],seq:{receipt:0},
    settings:{name:'',idno:'',address:'',phone:'',email:'',iban:'',currency:'€',currencyWord:'欧元',
      prefix:'R',lang:'zh-es',copies:2,signFile:null,stamp:true}};
}
function load(){
  try{ const s=localStorage.getItem(KEY); if(s){ const d=JSON.parse(s); const b=blank(); d.settings=Object.assign(b.settings,d.settings||{}); return Object.assign(b,d);} }catch(e){}
  return blank();
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){ alert('保存失败：'+e.message); } }

/* ---------- IndexedDB for files ---------- */
let _db;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const r=indexedDB.open('zuqi-files',1);
    r.onupgradeneeded=()=>r.result.createObjectStore('files',{keyPath:'id'});
    r.onsuccess=()=>{_db=r.result;res(_db)}; r.onerror=()=>rej(r.error);
  });
}
function tx(mode,fn){ return idb().then(db=>new Promise((res,rej)=>{ const t=db.transaction('files',mode); const st=t.objectStore('files'); const out=fn(st); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); })); }
const putFile=f=>tx('readwrite',st=>st.put(f));
const getFile=id=>tx('readonly',st=>st.get(id));
const delFile=id=>tx('readwrite',st=>st.delete(id));
const allFiles=()=>tx('readonly',st=>st.getAll());
const clearFiles=()=>tx('readwrite',st=>st.clear());
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{ const n=parseFloat(String(v==null?'':v).replace(',','.')); return isNaN(n)?0:n; };
const r2=n=>Math.round(n*100)/100;
const money=n=>{ const c=D.settings.currency||'€'; const s=Math.abs(n).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}); return (n<0?'-':'')+s+' '+c; };
const pad=n=>String(n).padStart(2,'0');
const today=()=>{ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
const thisMonth=()=>today().slice(0,7);
const fmtDate=s=>s?s.split('-').reverse().join('/'):'';
const fmtMonthZh=m=>m?(m.slice(0,4)+'年'+(+m.slice(5,7))+'月'):'';
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fmtMonthEs=m=>m?(MES[+m.slice(5,7)-1]+' de '+m.slice(0,4)):'';
const addMonth=(m,k)=>{ let y=+m.slice(0,4), mo=+m.slice(5,7)-1+k; y+=Math.floor(mo/12); mo=((mo%12)+12)%12; return y+'-'+pad(mo+1); };
const monthEnd=m=>{ const d=new Date(+m.slice(0,4),+m.slice(5,7),0); return m+'-'+pad(d.getDate()); };
const prop=id=>D.properties.find(p=>p.id===id);
const contract=id=>D.contracts.find(c=>c.id===id);
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),2200); }
function propLabel(p){ return p?(PTYPES[p.type]?.ic||'')+' '+p.name:'(已删除)'; }
function contractActiveIn(c,m){ if(!c.start) return false; if(c.start.slice(0,7)>m) return false; if(c.end && c.end.slice(0,7)<m) return false; return !c.closed || (c.end && c.end.slice(0,7)>=m); }
function activeContract(propId,date){ const m=(date||today()).slice(0,7); return D.contracts.find(c=>c.propertyId===propId && contractActiveIn(c,m)); }
function rentPayment(cid,m){ return D.payments.find(p=>p.contractId===cid && p.kind==='rent' && p.period===m); }
function dueDate(c,m){ const d=Math.min(c.payDay||1,+monthEnd(m).slice(8)); return m+'-'+pad(d); }
function receiptLang(p){ const c=contract(p.contractId); return (c&&LANGS[c.lang]?c.lang:'')||D.settings.lang||'zh-es'; }
const got=p=>p.pending?0:num(p.amountPaid);
function paymentStatus(p){ if(!p) return 'none'; if(p.pending) return 'pending'; const paid=num(p.amountPaid), tot=num(p.total); if(paid>=tot-0.004) return 'paid'; if(paid>0) return 'partial'; return 'none'; }

/* overdue: every month since contract start up to now where payment due date passed and not fully paid */
function overdueList(){
  const out=[]; const t=today(); const cur=thisMonth();
  D.contracts.forEach(c=>{
    if(!c.start) return;
    let m=c.start.slice(0,7); let guard=0;
    while(m<=cur && guard++<240){
      if(contractActiveIn(c,m)){
        const p=rentPayment(c.id,m); const st=paymentStatus(p);
        if(st!=='paid' && dueDate(c,m)<t){
          const owed=p? r2(num(p.total)-got(p)) : num(c.rent);
          out.push({c,m,p,owed,st});
        }
      }
      m=addMonth(m,1);
    }
  });
  return out;
}

/* ---------- money in words ---------- */
function cnUpper(n){
  const d='零壹贰叁肆伍陆柒捌玖', u=['','拾','佰','仟'], big=['','万','亿'];
  const cents=Math.round(Math.abs(n)*100); let int=Math.floor(cents/100); const jiao=Math.floor(cents/10)%10, fen=cents%10;
  let s='';
  if(int===0) s='零';
  else{
    const groups=[]; while(int>0){groups.push(int%10000); int=Math.floor(int/10000);}
    let res='', zeroPending=false;
    for(let gi=groups.length-1;gi>=0;gi--){
      const g=groups[gi];
      if(g===0){ if(res) zeroPending=true; continue; }
      if(res && (zeroPending || g<1000)) res+='零';
      zeroPending=false;
      let gs='', z=false;
      for(let i=3;i>=0;i--){ const dg=Math.floor(g/Math.pow(10,i))%10;
        if(dg===0){ if(gs) z=true; } else { if(z){gs+='零';z=false;} gs+=d[dg]+u[i]; } }
      res+=gs+big[gi];
    }
    s=res;
  }
  const unit=D.settings.currencyWord||'元';
  s+=unit;
  if(!jiao && !fen) return s+'整';
  if(jiao) s+=d[jiao]+'角'; else s+='零';
  if(fen) s+=d[fen]+'分';
  return s;
}
function esWords(n){
  const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
  const T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
  const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
  const lt100=x=>x<30?U[x]:T[Math.floor(x/10)]+(x%10?' y '+U[x%10]:'');
  const lt1000=x=>{ if(x===100) return 'cien'; const c=Math.floor(x/100), r=x%100; return [c?C[c]:'', r?lt100(r):''].filter(Boolean).join(' '); };
  const apoc=s=>s.replace(/veintiuno$/,'veintiún').replace(/uno$/,'un');
  const int=x=>{
    if(x===0) return 'cero';
    const mi=Math.floor(x/1e6), th=Math.floor(x/1000)%1000, r=x%1000, parts=[];
    if(mi) parts.push(mi===1?'un millón':apoc(lt1000(mi))+' millones');
    if(th) parts.push(th===1?'mil':apoc(lt1000(th))+' mil');
    if(r) parts.push(lt1000(r));
    return parts.join(' ');
  };
  const cents=Math.round(Math.abs(n)*100), e=Math.floor(cents/100), c=cents%100;
  let s=apoc(int(e))+(e===1?' euro':' euros');
  if(c) s+=' con '+apoc(lt100(c))+(c===1?' céntimo':' céntimos');
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* ---------- files UI ---------- */
const urlCache={};
async function fileUrl(id){ if(urlCache[id]) return urlCache[id]; const f=await getFile(id); if(!f) return null; urlCache[id]=URL.createObjectURL(f.blob); return urlCache[id]; }
function readAsFiles(input){ return Array.from(input.files||[]); }
async function storeUploads(fileList){
  const ids=[];
  for(const f of fileList){
    let blob=f;
    if(f.type.startsWith('image/') && f.size>900*1024) blob=await shrinkImage(f).catch(()=>f);
    const id=uid(); await putFile({id,name:f.name,type:blob.type||f.type,size:blob.size,blob,added:today()}); ids.push(id);
  }
  return ids;
}
function shrinkImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(); const u=URL.createObjectURL(file);
    img.onload=()=>{ const max=2000; let w=img.width,h=img.height; const k=Math.min(1,max/Math.max(w,h)); w=Math.round(w*k); h=Math.round(h*k);
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=>{URL.revokeObjectURL(u); b?res(new File([b],file.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})):rej()},'image/jpeg',0.85); };
    img.onerror=rej; img.src=u;
  });
}
async function renderFiles(el,ids,removable){
  if(!el) return;
  if(!ids||!ids.length){ el.innerHTML=removable?'':'<span class="muted small">无附件</span>'; return; }
  const parts=[];
  for(const id of ids){
    const f=await getFile(id); if(!f) continue;
    const isImg=(f.type||'').startsWith('image/');
    const u=await fileUrl(id);
    parts.push(`<div class="file" data-open="${id}">${isImg?`<img src="${u}" alt="">`:`<div class="ic">${(f.type||'').includes('pdf')?'📕':'📄'}</div>`}<div class="nm">${esc(f.name)}</div>${removable?`<button type="button" class="x" data-rm="${id}" title="移除">×</button>`:''}</div>`);
  }
  el.innerHTML=parts.join('');
}
async function openViewer(id){
  const f=await getFile(id); if(!f) return; const u=await fileUrl(id);
  const isImg=(f.type||'').startsWith('image/'), isPdf=(f.type||'').includes('pdf');
  const v=document.createElement('div'); v.className='viewer';
  v.innerHTML=`<div class="vt"><span>${esc(f.name)}</span><a class="btn sm" href="${u}" download="${esc(f.name)}">下载</a><button class="sm" data-close>关闭</button></div>
  <div class="vb">${isImg?`<img src="${u}">`:isPdf?`<iframe src="${u}"></iframe>`:`<a class="btn pri" href="${u}" download="${esc(f.name)}">下载文件</a>`}</div>`;
  v.addEventListener('click',e=>{ if(e.target.closest('[data-close]')||e.target===v||e.target.classList.contains('vb')) v.remove(); });

/* ---------- modal ---------- */
function modal({title,body,wide,buttons,onMount}){
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal${wide?' wide':''}"><div class="mh"><b>${title}</b><button class="sm" data-x>✕</button></div><form class="mb" novalidate>${body}</form><div class="mf"></div></div>`;
  const close=()=>bg.remove();
  const mf=bg.querySelector('.mf');
  (buttons||[{t:'关闭'}]).forEach(b=>{ const btn=document.createElement('button'); btn.type='button'; btn.textContent=b.t; if(b.cls) btn.className=b.cls;
    btn.onclick=async()=>{ if(b.fn){ const r=await b.fn(bg.querySelector('form'),close); if(r===false) return; } close(); }; mf.appendChild(btn); });
  bg.querySelector('[data-x]').onclick=close;
  bg.addEventListener('mousedown',e=>{ if(e.target===bg) bg._down=true; });
  bg.addEventListener('click',e=>{ if(e.target===bg && bg._down) close(); bg._down=false; });
  bg.querySelector('form').addEventListener('submit',e=>e.preventDefault());
  document.body.appendChild(bg);
  if(onMount) onMount(bg.querySelector('form'),close);
  const first=bg.querySelector('input:not([type=checkbox]):not([type=file]),select,textarea'); if(first) setTimeout(()=>first.focus(),30);
  return {el:bg,close};
}
const fv=(form,name)=>{ const el=form.elements[name]; if(!el) return ''; if(el.type==='checkbox') return el.checked; return el.value.trim(); };
const opt=(obj,sel,lang='zh')=>Object.entries(obj).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${esc(v[lang]||v)}</option>`).join('');
const propOptions=(sel,filter)=>D.properties.filter(filter||(()=>true)).map(p=>`<option value="${p.id}"${p.id===sel?' selected':''}>${esc(propLabel(p))}</option>`).join('');

/* attachment field inside forms */
function attachField(name,ids){ return `<label class="f">附件（照片 / PDF，可多选；手机可直接拍照）<input type="file" name="${name}" multiple accept="image/*,application/pdf"></label><div class="files" data-files="${name}"></div><input type="hidden" name="${name}_keep" value="${esc((ids||[]).join(','))}">`; }
function mountAttach(form,name){
  const box=form.querySelector(`[data-files="${name}"]`), keep=form.elements[name+'_keep'];
  const draw=()=>renderFiles(box,keep.value?keep.value.split(','):[],true);
  box.addEventListener('click',e=>{ const rm=e.target.closest('[data-rm]'); if(rm){ e.stopPropagation(); keep.value=keep.value.split(',').filter(x=>x&&x!==rm.dataset.rm).join(','); form._removed=(form._removed||[]).concat(rm.dataset.rm); draw(); } });
  draw();
}
async function collectAttach(form,name){
  const kept=fv(form,name+'_keep')?fv(form,name+'_keep').split(','):[];
  const added=await storeUploads(readAsFiles(form.elements[name]));
  for(const id of (form._removed||[])) await delFile(id).catch(()=>{});
  return kept.concat(added);
}

    const total=r2(clean.reduce((s,it)=>s+it.amount,0));
    const rno=fv(f,'receiptNo')||nextReceiptNo();
    if(D.payments.some(x=>x!==p && x.receiptNo===rno)){ alert('收据编号 '+rno+' 已存在'); return false; }
    const rec=p||{id:uid(),created:today()};
    Object.assign(rec,{kind:kindV,contractId:cidV,propertyId:cc.propertyId,tenant:cc.tenant,period:kindV==='rent'?per:'',paidDate:fv(f,'paidDate')||today(),method:fv(f,'method'),
      items:clean,total,amountPaid:fv(f,'amountPaid')===''?total:r2(num(fv(f,'amountPaid'))),note:fv(f,'note'),receiptNo:rno});
    if(rec.pending && !fv(f,'pending')) rec.receivedDate=today();
    rec.pending=!!fv(f,'pending'); if(rec.pending) delete rec.receivedDate;
    if(isNew){ D.payments.push(rec); bumpReceiptNo(rno); }
    D.bills.forEach(b=>{ if(b.paymentId===rec.id) b.paymentId=null; });
    clean.forEach(it=>{ if(it.billId){ const b=D.bills.find(x=>x.id===it.billId); if(b) b.paymentId=rec.id; } });
    save(); rerender(); toast('已保存');
    if(print) setTimeout(()=>showReceipt(rec.id),50);
  }
}
function billItem(b){ const t=BILL_TYPES[b.type]||BILL_TYPES.other; const per=b.from||b.to?' '+rangeTxt(b):''; const use=b.usage?` (${b.usage} ${t.unit})`:'';
  return {desc:t.zh+per+use, descEs:t.es+per+use, amount:num(b.tenantAmount), billId:b.id}; }
function nextReceiptNo(peek){ const y=new Date().getFullYear(); const n=(D.seq.receipt||0)+1; return (D.settings.prefix||'')+y+'-'+String(n).padStart(4,'0'); }
function bumpReceiptNo(rno){ const m=String(rno).match(/(\d+)$/); const n=m?+m[1]:0; D.seq.receipt=Math.max(D.seq.receipt||0,n); }

    {t:'保存',cls:'pri',fn:async f=>{
      if(fv(f,'amount')===''){ alert('请填写账单金额'); return false; }
      const rec=b||{id:uid()};
      const usage=fv(f,'usage')||(fv(f,'prev')!==''&&fv(f,'curr')!==''?String(r2(num(fv(f,'curr'))-num(fv(f,'prev')))):'');

      rec.files=await collectAttach(f,'files');
      if(!charge && rec.paymentId){ /* keep link, receipt already issued */ }
      if(isNew) D.bills.push(rec);
      /* sync amount into an already-issued receipt item */
      if(rec.paymentId){ const p=D.payments.find(x=>x.id===rec.paymentId); const it=p&&p.items.find(i=>i.billId===rec.id); if(it){ Object.assign(it,billItem(rec)); p.total=r2(p.items.reduce((s,i)=>s+num(i.amount),0)); } }
      save(); rerender(); toast('账单已保存');
    }}],
    onMount(f){
      mountAttach(f,'files');
      const sync=()=>{ f.querySelector('[data-unit]').textContent=BILL_TYPES[fv(f,'type')]?.unit?'（'+BILL_TYPES[fv(f,'type')].unit+'）':'';
        f.querySelector('[data-ch]').style.display=fv(f,'payer')==='landlord'?'':'none';
        f.querySelector('[data-ta]').style.display=fv(f,'chargeTenant')?'':'none'; };
      const prefill=()=>{ if(!isNew) return; const l=D.bills.filter(x=>x.propertyId===fv(f,'propertyId')&&x.type===fv(f,'type')).sort((a,c)=>(c.to||c.date||'').localeCompare(a.to||a.date||''))[0];
        if(l){ if(l.curr!==''&&l.curr!=null) f.elements.prev.value=l.curr; if(l.to) f.elements.from.value=addDays(l.to,1); f.elements.supplier.value=l.supplier||''; f.elements.chargeTenant.checked=!!l.chargeTenant; f.elements.payer.value=l.payer||'landlord'; }
        else { f.elements.prev.value=''; } sync(); };
      ['type','payer','chargeTenant'].forEach(n=>f.elements[n].addEventListener('change',sync));
      ['type','propertyId'].forEach(n=>f.elements[n].addEventListener('change',prefill));
      const autoUse=()=>{ if(fv(f,'prev')!==''&&fv(f,'curr')!=='') f.elements.usage.placeholder='= '+r2(num(fv(f,'curr'))-num(fv(f,'prev'))); };
      f.elements.prev.addEventListener('input',autoUse); f.elements.curr.addEventListener('input',autoUse);
      prefill(); sync(); autoUse();
    }});
}

function yearReceipts(){
  const act=D.contracts.filter(c=>!c.closed);
  if(!act.length) return alert('请先添加租客合同');
  const y=new Date().getFullYear();
  const start=thisMonth()<=y+'-01'?y+'-01':thisMonth();
  modal({title:'📅 一次生成全年收据',wide:true,body:`
    <p class="small">为选中的租客提前开好每个月的租金收据，可一次全部打印。每张收据日期 = 当月交租日。<br>这些收据先标记为 <span class="tag pri">收据已开·待收</span>，到时候收到钱，把那张纸交给租客，再在软件里点 <b>“✔ 确认已收”</b>。</p>
    <h3>租客</h3>
    ${act.map(c=>`<label class="chk"><input type="checkbox" name="c_${c.id}" checked> ${esc(c.tenant)} — ${esc(propLabel(prop(c.propertyId)))} · ${money(num(c.rent))}/月 · 每月 ${c.payDay||1} 号</label>`).join('')}
    <div class="grid3">
      <label class="f">从哪个月开始<input type="month" name="from" value="${start}"></label>
      <label class="f">几个月<input type="number" name="n" min="1" max="24" value="12"></label>
      <label class="f">收据日期<select name="dmode"><option value="due">每月交租日</option><option value="first">每月 1 号</option></select></label>
    </div>
    <label class="chk"><input type="checkbox" name="printNow" checked> 生成后马上打印（每个月一张 A4，一式两联）</label>
    <p class="small muted" id="yr-prev"></p>`,
    buttons:[{t:'取消'},{t:'生成收据',cls:'pri',fn:async f=>{
      const plan=yearPlan(f); if(!plan.list.length){ alert('没有需要生成的月份（可能都已经有记录了）。'); return false; }
      if(!confirm(`将生成 ${plan.list.length} 张收据${plan.skip?`（跳过已有记录 / 不在合同期内的 ${plan.skip} 个月）`:''}，确定？`)) return false;
      const ids=[];
      plan.list.forEach(({c,m})=>{
        const rno=nextReceiptNo(); bumpReceiptNo(rno);
        const rec={id:uid(),created:today(),kind:'rent',contractId:c.id,propertyId:c.propertyId,tenant:c.tenant,period:m,
          paidDate:fv(f,'dmode')==='first'?m+'-01':dueDate(c,m),method:c.method||'transfer',
          items:[{desc:'租金 '+fmtMonthZh(m),descEs:'Renta '+fmtMonthEs(m),amount:num(c.rent)}],total:num(c.rent),amountPaid:num(c.rent),note:'',receiptNo:rno,pending:true};
        D.payments.push(rec); ids.push(rec.id);
      });
      save(); rerender(); toast(`已生成 ${ids.length} 张收据`);
      if(fv(f,'printNow')) await printReceipts(ids);
    }}],
    onMount(f){ const upd=()=>{ const p=yearPlan(f); f.querySelector('#yr-prev').textContent=`将生成 ${p.list.length} 张收据`+(p.skip?`，跳过 ${p.skip} 个月（已有记录或不在合同期内）`:'')+(p.list.length?`：${fmtMonthZh(p.list[0].m)} 起`:''); };
      f.addEventListener('input',upd); f.addEventListener('change',upd); upd(); }});
}
function yearPlan(f){
  const from=fv(f,'from')||thisMonth(), n=Math.min(24,Math.max(1,parseInt(fv(f,'n'))||12));
  const list=[]; let skip=0;
  D.contracts.filter(c=>!c.closed && f.elements['c_'+c.id] && f.elements['c_'+c.id].checked).forEach(c=>{
    for(let i=0;i<n;i++){ const m=addMonth(from,i); if(!contractActiveIn(c,m)||rentPayment(c.id,m)){ skip++; continue; } list.push({c,m}); }
  });
  return {list,skip};
}

views.report=function(el){
  const y=state.reportYear;
  const years=[...new Set([String(new Date().getFullYear()),...D.payments.map(p=>(p.paidDate||'').slice(0,4)),...D.bills.map(b=>(b.date||b.to||'').slice(0,4))].filter(Boolean))].sort().reverse();
  const rows=[]; let T={rent:0,extra:0,dep:0,exp:0};
  for(let i=1;i<=12;i++){
    const m=y+'-'+pad(i);
    const ps=D.payments.filter(p=>!p.pending&&(p.receivedDate||p.paidDate||'').slice(0,7)===m);
    let rent=0,extra=0,dep=0;
    ps.forEach(p=>{ const ratio=num(p.total)?got(p)/num(p.total):1;
      p.items.forEach(it=>{ const a=num(it.amount)*ratio; if(p.kind==='deposit') dep+=a; else if(it.billId) extra+=a; else if(p.kind==='rent'&&!it.billId) rent+=a; else extra+=a; }); });
    const exp=D.bills.filter(b=>b.payer!=='tenant' && (b.date||b.to||'').slice(0,7)===m).reduce((s,b)=>s+num(b.amount),0);
    rows.push({m,rent,extra,dep,exp}); T.rent+=rent;T.extra+=extra;T.dep+=dep;T.exp+=exp;
  }
  const byProp=D.properties.map(p=>{ const inc=D.payments.filter(x=>x.propertyId===p.id&&x.kind!=='deposit'&&!x.pending&&(x.receivedDate||x.paidDate||'').startsWith(y)).reduce((s,x)=>s+got(x),0);
    const ex=D.bills.filter(b=>b.propertyId===p.id&&b.payer!=='tenant'&&(b.date||b.to||'').startsWith(y)).reduce((s,b)=>s+num(b.amount),0); return {p,inc,ex}; });
  const byType={}; D.bills.filter(b=>b.payer!=='tenant'&&(b.date||b.to||'').startsWith(y)).forEach(b=>{ byType[b.type]=(byType[b.type]||0)+num(b.amount); });
  const recov=D.bills.filter(b=>b.chargeTenant&&(b.date||b.to||'').startsWith(y)).reduce((s,b)=>s+num(b.tenantAmount),0);
  const maxv=Math.max(1,...rows.map(r=>Math.max(r.rent+r.extra,r.exp)));
  el.innerHTML=`<div class="row between" style="margin-bottom:12px"><h2 style="margin:0">年度报表</h2>
    <div class="row"><select id="ry" style="width:auto">${years.map(x=>`<option${x===y?' selected':''}>${x}</option>`).join('')}</select><button id="csv">导出 CSV（Excel）</button></div></div>
  <div class="stats">
    <div class="stat ok"><div class="k">${y} 租金收入</div><div class="v">${money(T.rent)}</div></div>
    <div class="stat"><div class="k">向租客收回的费用</div><div class="v">${money(T.extra)}</div></div>
    <div class="stat warn"><div class="k">房东支付的账单/支出</div><div class="v">${money(T.exp)}</div></div>
    <div class="stat ${T.rent+T.extra-T.exp>=0?'ok':'bad'}"><div class="k">净收入（不含押金）</div><div class="v">${money(T.rent+T.extra-T.exp)}</div></div>
  </div>
  <div class="card"><h3>按月</h3><div class="tbl-wrap"><table><tr><th>月份</th><th class="num">租金</th><th class="num">收回费用</th><th class="num">押金</th><th class="num">支出</th><th class="num">净额</th><th style="width:30%"></th></tr>
    ${rows.map(r=>`<tr><td>${+r.m.slice(5)}月</td><td class="num">${money(r.rent)}</td><td class="num">${money(r.extra)}</td><td class="num">${r.dep?money(r.dep):'—'}</td><td class="num">${money(r.exp)}</td><td class="num"><b>${money(r.rent+r.extra-r.exp)}</b></td>
      <td><div style="height:7px;background:var(--ok);border-radius:3px;width:${(r.rent+r.extra)/maxv*100}%"></div><div style="height:7px;background:#e0a33a;border-radius:3px;margin-top:2px;width:${r.exp/maxv*100}%"></div></td></tr>`).join('')}
    <tr><th>合计</th><th class="num">${money(T.rent)}</th><th class="num">${money(T.extra)}</th><th class="num">${money(T.dep)}</th><th class="num">${money(T.exp)}</th><th class="num">${money(T.rent+T.extra-T.exp)}</th><th></th></tr></table></div>
    <p class="small muted">绿色 = 收入，橙色 = 支出。收入按实际收款日期计算；押金单独列出，不计入净收入。</p></div>
  <div class="grid2" style="gap:14px">
    <div class="card"><h3>按房产</h3>${byProp.length?byProp.map(x=>`<div class="sum-line"><span>${esc(propLabel(x.p))}</span><span>收 ${money(x.inc)} · 支 ${money(x.ex)}</span></div>`).join(''):'<p class="muted small">无</p>'}</div>
    <div class="card"><h3>支出分类</h3>${Object.keys(byType).length?Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="sum-line"><span>${BILL_TYPES[k]?.ic||''} ${esc(BILL_TYPES[k]?.zh||k)}</span><b>${money(v)}</b></div>`).join(''):'<p class="muted small">无</p>'}
      <p class="small muted">其中已转给租客承担：${money(recov)}</p></div>
  </div>`;
  $('#ry').onchange=e=>{ state.reportYear=e.target.value; rerender(); };
  $('#csv').onclick=()=>{
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const lines=[['类型','日期','房产','租客/供应商','项目','所属月份','应收/账单金额','实收','备注'].map(q).join(',')];
    D.payments.filter(p=>(p.paidDate||'').startsWith(y)).forEach(p=>lines.push([ '收款 '+p.receiptNo,p.paidDate,propLabel(prop(p.propertyId)),p.tenant,p.items.map(i=>i.desc).join(' + '),p.period,num(p.total).toFixed(2),p.pending?'预开未收':got(p).toFixed(2),p.note].map(q).join(',')));
    D.bills.filter(b=>(b.date||b.to||'').startsWith(y)).forEach(b=>lines.push(['账单 '+(BILL_TYPES[b.type]?.zh||b.type),b.date||b.to,propLabel(prop(b.propertyId)),b.supplier,(b.from?b.from+'~'+b.to:'')+(b.usage?' 用量'+b.usage:''),'',num(b.amount).toFixed(2),b.payer==='tenant'?'租客自付':b.chargeTenant?'转租客 '+num(b.tenantAmount).toFixed(2):'房东承担',b.note].map(q).join(',')));
    download('﻿'+lines.join('\r\n'),`收租报表-${y}.csv`,'text/csv;charset=utf-8');
  };
};
function download(content,name,type){ const b=content instanceof Blob?content:new Blob([content],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000); }

    </div>
    <label class="f">地址<input name="address" value="${esc(S.address)}"></label>
    <label class="f">收款银行账号 IBAN（可空，会印在收据上）<input name="iban" value="${esc(S.iban)}"></label>
    <h3 style="margin-top:8px">收据</h3>
    <div class="grid3">
      <label class="f">货币符号<input name="currency" value="${esc(S.currency)}"></label>
      <label class="f">中文大写货币单位<input name="currencyWord" value="${esc(S.currencyWord)}" placeholder="欧元 / 元"></label>
      <label class="f">编号前缀<input name="prefix" value="${esc(S.prefix)}"></label>
      <label class="f">默认收据语言（租客没单独设置时用）<select name="lang">${opt(LANGS,S.lang)}</select></label>
      <label class="f">份数<select name="copies"><option value="2"${S.copies!=1?' selected':''}>一式两联</option><option value="1"${S.copies==1?' selected':''}>一联</option></select></label>
      <label class="f">当前编号计数（下一张 = 此数 + 1）<input name="seq" type="number" min="0" value="${D.seq.receipt||0}"></label>
    </div>
    <label class="chk"><input type="checkbox" name="stamp"${S.stamp?' checked':''}> 全额收讫的收据加盖 “已收讫 PAGADO” 印章</label>
    <label class="f">签名图片（可选：在白纸上签名后拍照上传，会印在签名处）<input type="file" name="sign" accept="image/*"></label>
    <div class="files" id="sigbox"></div>
    <div class="row" style="margin-top:10px"><button class="pri" type="submit">保存设置</button>${S.signFile?'<button type="button" class="danger" id="rmsig">删除签名</button>':''}</div>
  </form>
  <div class="card"><h3>💾 备份与恢复</h3>
    <p class="small">所有数据（包括上传的账单照片）只保存在<b>这台设备的这个浏览器</b>里，不会上传到任何服务器。请<b>定期下载备份</b>，换手机/电脑时用 “恢复备份” 导入。清除浏览器数据会丢失记录。</p>
    <div class="row"><button class="pri" id="bk">⬇ 下载完整备份</button><label class="btn">⬆ 恢复备份<input type="file" id="rs" accept=".json,application/json" hidden></label></div>
    <p class="small muted" id="usage"></p>
  </div>
  <div class="card"><h3>其他</h3><div class="row"><button id="demo">载入示例数据（试用）</button><button class="danger" id="wipe">清空全部数据</button></div></div>`;
  const f=$('#sf');
  if(S.signFile) renderFiles($('#sigbox'),[S.signFile],false);
  f.onsubmit=async e=>{ e.preventDefault();
    ['name','idno','phone','email','address','iban','currency','currencyWord','prefix','lang'].forEach(k=>S[k]=fv(f,k));
    S.copies=+fv(f,'copies'); S.stamp=fv(f,'stamp'); D.seq.receipt=Math.max(0,parseInt(fv(f,'seq'))||0);
    const sf=readAsFiles(f.elements.sign); if(sf.length){ if(S.signFile) await delFile(S.signFile).catch(()=>{}); S.signFile=(await storeUploads(sf))[0]; }
    save(); toast('设置已保存'); route(); };
  if($('#rmsig')) $('#rmsig').onclick=async()=>{ await delFile(S.signFile).catch(()=>{}); S.signFile=null; save(); route(); };
  $('#bk').onclick=backup;
  $('#rs').onchange=e=>restore(e.target.files[0]);
  $('#wipe').onclick=async()=>{ if(!confirm('确定清空所有数据？此操作不可恢复（建议先下载备份）。')) return; if(prompt('请输入 “清空” 确认')!=='清空') return; D=blank(); save(); await clearFiles(); route(); toast('已清空'); };
  $('#demo').onclick=()=>{ if(D.properties.length && !confirm('已有数据，示例数据会追加进去。继续？')) return; loadDemo(); location.hash='#home'; route(); toast('已载入示例数据'); };
  if(navigator.storage&&navigator.storage.estimate) navigator.storage.estimate().then(e=>{ $('#usage')&&($('#usage').textContent=`已使用存储约 ${(e.usage/1048576).toFixed(1)} MB`); });
};
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(b); }); }
async function backup(){
  const files=await allFiles(); const out=[];
  for(const f of files) out.push({id:f.id,name:f.name,type:f.type,added:f.added,data:await blobToDataURL(f.blob)});
  download(JSON.stringify({app:'zuqi',version:1,exported:new Date().toISOString(),data:D,files:out}),`收租备份-${today()}.json`,'application/json');
  D.settings.lastBackup=today(); save(); toast('备份已下载');
}
async function restore(file){
  if(!file) return;
  try{
    const j=JSON.parse(await file.text()); if(j.app!=='zuqi'||!j.data) throw new Error('不是收租管家的备份文件');
    if(!confirm(`备份时间：${(j.exported||'').slice(0,10)}\n恢复会覆盖当前所有数据，确定？`)) return;
    await clearFiles();
    for(const f of j.files||[]){ const blob=await (await fetch(f.data)).blob(); await putFile({id:f.id,name:f.name,type:f.type,added:f.added,blob}); }
    D=Object.assign(blank(),j.data); D.settings=Object.assign(blank().settings,j.data.settings||{}); save();
    Object.keys(urlCache).forEach(k=>delete urlCache[k]); route(); toast('恢复完成');
  }catch(e){ alert('恢复失败：'+e.message); }
}
function loadDemo(){
  const y=new Date().getFullYear(); const m0=thisMonth();
  const h={id:uid(),name:'Calle Mayor 12, 3ºB',type:'house',address:'Calle Mayor 12, 3ºB, 28013 Madrid',files:[]};
  const g={id:uid(),name:'车库 Plaza 27',type:'garage',address:'Calle Mayor 12, Sótano -1, Plaza 27, 28013 Madrid',files:[]};
  D.properties.push(h,g);
  const ch={id:uid(),propertyId:h.id,tenant:'Juan García López',idno:'12345678Z',phone:'600 123 456',method:'transfer',rent:850,deposit:1700,payDay:5,start:addMonth(m0,-3)+'-01',end:'',files:[]};
  const cg={id:uid(),propertyId:g.id,tenant:'María Pérez',idno:'X1234567L',phone:'611 222 333',method:'bizum',rent:90,deposit:90,payDay:1,start:addMonth(m0,-2)+'-01',end:'',files:[]};
  D.contracts.push(ch,cg);
  for(let k=-3;k<0;k++){ const m=addMonth(m0,k); const rno=nextReceiptNo(); bumpReceiptNo(rno);
    D.payments.push({id:uid(),kind:'rent',contractId:ch.id,propertyId:h.id,tenant:ch.tenant,period:m,paidDate:m+'-05',method:'transfer',items:[{desc:'租金 '+fmtMonthZh(m),descEs:'Renta '+fmtMonthEs(m),amount:850}],total:850,amountPaid:850,note:'',receiptNo:rno}); }
  const lm=addMonth(m0,-1);
  D.bills.push({id:uid(),propertyId:h.id,type:'electric',from:addMonth(m0,-2)+'-01',to:monthEnd(lm),prev:'10234',curr:'10552',usage:'318',amount:68.4,date:lm+'-20',supplier:'Iberdrola',payer:'landlord',chargeTenant:true,tenantAmount:68.4,note:'',files:[]});
  D.bills.push({id:uid(),propertyId:h.id,type:'water',from:addMonth(m0,-3)+'-01',to:monthEnd(lm),prev:'512',curr:'538',usage:'26',amount:41.2,date:lm+'-18',supplier:'Canal de Isabel II',payer:'landlord',chargeTenant:true,tenantAmount:41.2,note:'',files:[]});
  D.bills.push({id:uid(),propertyId:h.id,type:'community',from:'',to:'',prev:'',curr:'',usage:'',amount:120,date:lm+'-02',supplier:'Comunidad de propietarios',payer:'landlord',chargeTenant:false,tenantAmount:0,note:'季度物业费',files:[]});
  if(!D.settings.name) Object.assign(D.settings,{name:'王小明 (ejemplo)',idno:'Y0000000T',address:'Calle Ejemplo 1, Madrid',phone:'622 000 000'});
  save();
}

/* ---------- start ---------- */
route();
if(D.properties.length && (!D.settings.lastBackup || D.settings.lastBackup<addDays(today(),-30))){
  setTimeout(()=>toast('提醒：已超过 30 天没有下载备份（设置 / 备份）'),800);
}
</script>
