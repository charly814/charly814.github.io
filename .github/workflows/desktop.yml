# Instalador de Windows del TPV (desktop/). Se construye en un Windows de GitHub y se
# publica como «Release»: la app instalada lo ve y se actualiza sola.
# Para sacar una versión nueva: subir "version" en desktop/package.json y llevarlo a main.
name: TPV Windows

on:
  push:
    branches: [main]
    paths: ['desktop/package.json', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Instalar
        working-directory: desktop
        run: npm ci
      - name: Probar el servidor del local
        working-directory: desktop
        run: node -e "require('./server.js'); console.log('server ok')"
      # GitHub solo publica una «Release» sobre una etiqueta que exista (v1.0.0, v1.0.1…)
      - name: Etiqueta de la versión
        shell: bash
        run: |
          V="v$(node -p "require('./desktop/package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$V" > /dev/null; then
            echo "La etiqueta $V ya existe"
          else
            git tag "$V" && git push origin "$V"
          fi
      - name: Construir y publicar
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist
      # copia del instalador en la ejecución (por si la publicación fallara)
      - name: Guardar el instalador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Platet-TPV-instalador
          path: desktop/dist/*.exe
          if-no-files-found: ignore
